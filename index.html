<style>

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); color:var(--ink); line-height:1.45;
    background-color:var(--paper);
    background-image:linear-gradient(var(--rule-faint) 1px,transparent 1px),
                     linear-gradient(90deg,var(--rule-faint) 1px,transparent 1px);
    background-size:22px 22px; padding:12px 12px 28px;

     text-transform:uppercase;margin:0}

         padding:6px 12px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink)}
  button.mini{padding:4px 8px;font-size:10px}
  button:disabled{opacity:.32;cursor:not-allowed}
  button:hover:not(:disabled){background:var(--blueprint);border-color:var(--blueprint);color:#fff}
  button:focus-visible{outline:2px solid var(--blueprint);outline-offset:2px}
  select,input[type=number]{font-family:var(--mono);font-size:11.5px;padding:4px 6px;
         border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
  select:focus,input:focus{outline:2px solid var(--blueprint);outline-offset:-1px;background:#fff}
  input[type=number]{width:98px}
  label.f{display:flex;align-items:center;gap:5px}
  #status{font-size:12px;color:var(--muted)}
  #status.err{color:var(--fail)} #status.ok{color:var(--pass)}
  #files{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--rule);
        background:var(--paper);cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--blueprint);color:var(--blueprint)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .sz{color:var(--muted);margin-left:6px;font-size:10px}
  .chip.on .sz{color:#9fb0c4}
  #stage{background:var(--surface);border:1px solid var(--rule);padding:0;position:relative}
  #cv{display:block;width:100%;touch-action:none}
  .hidden{display:none!important}
  .empty{background:var(--surface);border:1px dashed var(--rule);padding:48px 24px;
         text-align:center;color:var(--muted);font-size:14px}

           text-transform:uppercase;color:var(--ink);margin-bottom:8px}
  body.drag::after{content:"Drop a .mat file";position:fixed;inset:0;background:rgba(43,74,125,.9);
    color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:20px;letter-spacing:.14em;text-transform:uppercase;z-index:99}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

function fmt(v){
  if (v===null||v===undefined||!isFinite(v)) return "—";
  const a=Math.abs(v);
  if (a===0) return "0";
  if (a>=1e5||a<1e-3) return v.toExponential(4);
  return String(+v.toPrecision(6));
}
function fmtT(v){
  if (!isFinite(v)) return "";
  const a=Math.abs(v);
  if (a===0) return "0";
  if (a>=1e4||a<1e-2) return v.toExponential(1);
  return String(+v.toPrecision(3));
}
function fmtBytes(n){
  if (n<1024) return n+" B";
  if (n<1048576) return (n/1024).toFixed(0)+" KB";
  if (n<1073741824) return (n/1048576).toFixed(1)+" MB";
  return (n/1073741824).toFixed(2)+" GB";
}

const HEXMAPS = {

    "fffffffefdfffefcfffdfafffdf8fffcf6fffcf4fffbf2fffaf0fff9eefff9ebfff8e9fff7e6fff6e4fff5e1fff5deff"+
    "f4dbfff3d8fff2d5fff0d1ffefceffeecaffedc6ffecc2ffeabeffe9baffe8b6ffe6b1ffe5acffe3a7ffe1a2ffe09cff"+

    "02fffd07fff80cfff311ffee16ffe91bffe420ffdf25ffda2affd52fffd034ffcb39ffc63effc142ffbd47ffb84cffb3"+
    "51ffae56ffa95bffa460ff9f65ff9a6aff956fff9074ff8b79ff867eff8182ff7d87ff788cff7391ff6e96ff699bff64"+
    "a0ff5fa5ff5aaaff55afff50b4ff4bb9ff46beff41c2ff3dc7ff38ccff33d1ff2ed6ff29dbff24e0ff1fe5ff1aeaff15"+
    "efff10f4ff0bf9ff06feff01fffd00fffb00fff800fff500fff200ffef00ffec00ffe800ffe400ffe000ffdc00ffd700"+

    "dc0000d90000d60000d30000d00000cc0000c50000bd0000b50000ad0000a500009e00009600008e00008600007e0000"+
    "7600006e00006600005f00005700004f00004700003f00003700002f0000270000200000180000100000080000000000"
};
const LUT={};
for (const [n,hex] of Object.entries(HEXMAPS)){
  const l=new Uint8Array(768);
  for (let i=0;i<768;i++) l[i]=parseInt(hex.substr(i*2,2),16);
  LUT[n]=l;
}
for (const [n,pts] of Object.entries(ANCHORS)){
  const l=new Uint8Array(768);
  for (let i=0;i<256;i++){
    const t=i/255*(pts.length-1), a=Math.min(pts.length-2,Math.floor(t)), f=t-a;
    const p=pts[a], q=pts[a+1];
    l[i*3]=p[0]+(q[0]-p[0])*f; l[i*3+1]=p[1]+(q[1]-p[1])*f; l[i*3+2]=p[2]+(q[2]-p[2])*f;
  }
  LUT[n]=l;
}
function activeLUT(){
  const b=LUT[S.cmap]||LUT.whitejet7;
  if (!S.invert) return b;
  if (!S._inv||S._invName!==S.cmap){
    const o=new Uint8Array(768);
    for(let i=0;i<256;i++){const j=255-i;o[i*3]=b[j*3];o[i*3+1]=b[j*3+1];o[i*3+2]=b[j*3+2];}
    S._inv=o; S._invName=S.cmap;
  }
  return S._inv;
}

/* ---------------- state ---------------- */
const S = {
  h5:null, fs:null, tmpPath:null, file:null, fileName:"",
  candidates:[], vectors:[],
  dims:[1,1,1], strides:[1,1,1], values:null,
  names:["dim1","dim2","dim3"], dataName:"", axes:[null,null,null],
  idx:[0,0,0], vmin:0, vmax:1, fullMin:0, fullMax:1,
  cmap:"whitejet7", invert:false, epoch:0,
  token:null, pickerReady:false, folderId:null
};

/* ---------------- HDF5 ---------------- */
async function loadH5(){
  const urls=["https://cdn.jsdelivr.net/npm/h5wasm@0.7/dist/esm/hdf5_hl.js",
              "https://unpkg.com/h5wasm@0.7/dist/esm/hdf5_hl.js"];
  let last;
  for (const u of urls){
    try{
      const mod=await import(/* @vite-ignore */ u);
      const h=mod.default||mod;
      const M=await h.ready;
      const fs=(M&&M.FS)||h.FS||mod.FS;
      if (!fs||typeof fs.writeFile!=="function") throw new Error("h5wasm loaded without a filesystem");
      return {h,fs};
    }catch(e){ last=e; console.warn("h5wasm",u,e); }
  }
  throw last||new Error("h5wasm unavailable");
}
const isDataset=o=>o&&typeof o==="object"&&"shape" in o&&"dtype" in o;
const isGroup=o=>o&&typeof o==="object"&&typeof o.keys==="function"&&!isDataset(o);

function scan(node,path,out){
  let keys; try{ keys=node.keys(); }catch(e){ return; }
  for (const k of keys){
    if (k==="#refs#"||k==="#subsystem#") continue;
    const p=path?path+"/"+k:k;
    let o; try{ o=node.get(k); }catch(e){ continue; }
    if (isGroup(o)) scan(o,p,out);
    else if (isDataset(o)){
      const dims=Array.from(o.shape||[]).slice().reverse();   // MATLAB writes dims reversed
      const n=dims.reduce((a,b)=>a*b,1);
      if (!n) continue;
      out.push({path:p,node:o,dims,eff:dims.filter(d=>d>1),count:n,dtype:String(o.dtype)});
    }
  }
}
function readFlat(e){
  let v; try{ v=e.node.value; }catch(err){ throw new Error("cannot read "+e.path+" ("+err.message+")"); }
  if (ArrayBuffer.isView(v)) return v;
  if (Array.isArray(v)){
    const f=[]; (function r(a){for(const x of a){Array.isArray(x)?r(x):f.push(typeof x==="number"?x:NaN);}})(v);
    return Float64Array.from(f);
  }
  throw new Error(e.path+" is not plain numeric data (complex or cell arrays are not supported yet)");
}

/* ---------------- opening ---------------- */
async function openBuffer(buf,name){
  status("Parsing "+name+" …");
  await new Promise(r=>setTimeout(r,10));
  try{
    if (S.file){ try{S.file.close();}catch(e){} S.file=null; }
    if (S.tmpPath){ try{S.fs.unlink(S.tmpPath);}catch(e){} }
    const tmp="/work_"+Date.now()+".h5";
    S.fs.writeFile(tmp,new Uint8Array(buf));
    S.tmpPath=tmp;
    S.file=new S.h5.File(tmp,"r");
    S.fileName=name;
    const all=[]; scan(S.file,"",all);
    if (!all.length) throw new Error("no datasets found — is this a -v7.3 file?");
    S.candidates=all.filter(e=>e.eff.length>=2).sort((a,b)=>b.count-a.count);
    S.vectors=all.filter(e=>e.eff.length===1&&e.count>1).sort((a,b)=>a.path.localeCompare(b.path));
    if (!S.candidates.length) throw new Error("no 2-D or 3-D arrays in this file");
    fillSelect($("selData"),S.candidates.map(e=>({v:e.path,t:e.path+"  ["+e.eff.join(" × ")+"]"})));
    $("varBar").classList.remove("hidden"); $("dispBar").classList.remove("hidden");
    selectData(S.candidates[0].path);
    status("Loaded "+name,"ok");
  }catch(e){ console.error(e); status(e.message,"err"); }
}
function fillSelect(sel,items,extra){
  sel.innerHTML="";
  if (extra){const o=document.createElement("option");o.value="";o.textContent=extra;sel.appendChild(o);}
  for (const it of items){const o=document.createElement("option");o.value=it.v;o.textContent=it.t;sel.appendChild(o);}
}
function selectData(path){
  const e=S.candidates.find(c=>c.path===path); if (!e) return;
  let values; try{ values=readFlat(e); }catch(err){ status(err.message,"err"); return; }
  const dims=[]; e.dims.forEach(d=>{ if(d>1) dims.push(d); });
  while (dims.length<3) dims.push(1);
  if (dims.length>3){ status("more than three non-singleton dimensions; showing the first three","err"); dims.length=3; }
  S.values=values; S.dims=dims;
  S.strides=[1,dims[0],dims[0]*dims[1]];
  S.dataName=e.path; S.idx=dims.map(d=>Math.floor(d/2));
  let lo=Infinity,hi=-Infinity;
  for (let i=0;i<values.length;i++){const v=values[i];if(v===v){if(v<lo)lo=v;if(v>hi)hi=v;}}
  if (!isFinite(lo)){lo=0;hi=1;}
  S.fullMin=lo; S.fullMax=hi; S.vmin=lo; S.vmax=hi;
  $("inVmin").value=+lo.toPrecision(6); $("inVmax").value=+hi.toPrecision(6);
  guessAxes();
  $("dimsTag").textContent=dims.join(" × ")+"   ·   "+fmt(lo)+" … "+fmt(hi);
  $("stage").classList.remove("hidden"); $("empty").classList.add("hidden");
  S.epoch++; resize(); draw();
}
function guessAxes(){
  const opts=S.vectors.map(v=>({v:v.path,t:v.path+" ["+v.count+"]"}));
  ["selX","selY","selZ"].forEach((id,d)=>{
    fillSelect($(id),opts,"index 1…"+S.dims[d]);
    const m=S.vectors.find(v=>v.count===S.dims[d]);
    $(id).value=(m&&S.dims[d]>1)?m.path:"";
    applyAxis(d);
  });
}
function applyAxis(d){
  const sel=$(["selX","selY","selZ"][d]).value;
  if (!sel){ S.axes[d]=null; S.names[d]=["dim1","dim2","dim3"][d]; return; }
  const e=S.vectors.find(v=>v.path===sel);
  if (!e||e.count!==S.dims[d]){ S.axes[d]=null; S.names[d]=["dim1","dim2","dim3"][d]; return; }
  try{ S.axes[d]=readFlat(e); S.names[d]=e.path.split("/").pop(); }catch(err){ S.axes[d]=null; }
}
const axVal=(d,i)=>{ const v=S.axes[d]; return (v&&v.length===S.dims[d])?v[i]:i+1; };
const axName=d=>S.names[d];
function axExtent(d){
  const n=S.dims[d], v=S.axes[d];
  if (!v||n<2||v.length!==n) return [-0.5,n-0.5];
  const a=v[0], b=v[n-1], s=(b-a)/(n-1);
  return [a-s/2,b+s/2];
}
function niceTicks(lo,hi,target){
  if (!isFinite(lo)||!isFinite(hi)||lo===hi) return [lo];
  const span=Math.abs(hi-lo);
  const mag=Math.pow(10,Math.floor(Math.log10(span/target)));
  const nrm=(span/target)/mag;
  const step=(nrm<1.5?1:nrm<3?2:nrm<7?5:10)*mag;
  const a=Math.min(lo,hi), b=Math.max(lo,hi), out=[];
  for (let v=Math.ceil(a/step)*step; v<=b+step*1e-9; v+=step) out.push(+v.toPrecision(12));
  return out;
}

/* ===========================================================
   Layout — the architectural arrangement.
     row 1 : cut along X   |   cut along Z
     row 2 : cut along Y | PANEL XY | PANEL ZY | colorbar
     row 3 : cut along Z | PANEL XZ | readout
   Panels XY and ZY share the vertical mapping exactly.
   Panels XY and XZ share the horizontal mapping exactly.
   Each 1-D strip inherits its panel's mapping, so the dashed
   lines line up across every plot.
   =========================================================== */
const GEO = { pad:12, cutW:92, cutH:80, gap:9, labL:52, labB:30, gapX:34, gapY:34, cbW:26, cbLab:60 };
let L = null;

function layout(W,H){
  const g=GEO;
  const leftBlock = g.pad + g.cutW + g.gap + g.labL;
  const rightBlock = g.gap + g.cbW + g.cbLab + g.pad;
  const avail = W - leftBlock - g.gapX - g.labL - rightBlock;
  const aw = Math.max(140, Math.floor(avail*0.5));
  const bw = Math.max(120, avail-aw);
  const ax = leftBlock, bx = ax+aw+g.gapX+g.labL;
  const ay = g.pad + g.cutH + g.gap;
  const availH = H - ay - g.labB - g.gapY - g.labB - g.pad;
  const ah = Math.max(140, Math.floor(availH*0.56));
  const ch = Math.max(110, availH-ah);
  const cy = ay + ah + g.labB + g.gapY;
  return {
    tl:{x:ax,y:ay,w:aw,h:ah}, tr:{x:bx,y:ay,w:bw,h:ah}, bl:{x:ax,y:cy,w:aw,h:ch},
    cutTopL:{x:ax,y:g.pad,w:aw,h:g.cutH},
    cutTopR:{x:bx,y:g.pad,w:bw,h:g.cutH},
    cutLeftT:{x:g.pad,y:ay,w:g.cutW,h:ah},
    cutLeftB:{x:g.pad,y:cy,w:g.cutW,h:ch},
    cbar:{x:bx+bw+g.gap,y:ay,w:g.cbW,h:ah},
    info:{x:bx,y:cy,w:bw,h:ch}
  };
}

/* Panels, in the MATLAB arrangement.  For explore3D(Vb, Vg, theta, G)
   the dimensions are 1 = bias, 2 = gate, 3 = theta, and the figure puts
   dim 1 on the vertical of both top panels, dim 3 on the horizontal of
   the left column, dim 2 horizontal top-right and vertical bottom-left. */
const PAN = [
  {key:"tl", h:2, v:0, fix:1},   // top-left    dim3 – dim1   (theta – bias)
  {key:"tr", h:1, v:0, fix:2},   // top-right   dim2 – dim1   (gate  – bias)
  {key:"bl", h:2, v:1, fix:0}    // bottom-left dim3 – dim2   (theta – gate)
];
/* 1-D strips: ax = axis plotted; dir "h" = value upward, "v" = value sideways;
   ref = the panel whose pixel mapping it must inherit exactly.               */
const STRIP = [
  {key:"cutTopL",  ax:2, dir:"h", ref:"tl"},
  {key:"cutTopR",  ax:1, dir:"h", ref:"tr"},
  {key:"cutLeftT", ax:0, dir:"v", ref:"tl"},
  {key:"cutLeftB", ax:1, dir:"v", ref:"bl"}
];

const cv = $("cv");
const ctx = cv.getContext("2d");
let DPR = 1;

function resize(){
  const stage=$("stage");
  if (stage.classList.contains("hidden")) return;
  DPR = window.devicePixelRatio||1;
  const W = stage.clientWidth;
  const top = stage.getBoundingClientRect().top + window.scrollY;
  const H = Math.max(660, Math.min(1250, window.innerHeight - 24 - (top - window.scrollY)));
  cv.style.height = H+"px";
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  L = layout(W,H);
  for (const p of PAN) p._built = -1;
}

/* ---- pixel mappings, shared by panels and their strips ---- */
const pxOf = (r,n,i) => r.x + (i+0.5)/n*r.w;             // horizontal, index → px
const pyOf = (r,n,j) => r.y + r.h - (j+0.5)/n*r.h;       // vertical,  index → px
const ixOf = (r,n,x) => Math.max(0,Math.min(n-1,Math.floor((x-r.x)/r.w*n)));
const iyOf = (r,n,y) => Math.max(0,Math.min(n-1,Math.floor((r.y+r.h-y)/r.h*n)));

/* ---- slice rendering into offscreen canvases ---- */
const off={};
function buildSlice(p){
  const nH=S.dims[p.h], nV=S.dims[p.v];
  let o=off[p.key];
  if (!o||o.cv.width!==nH||o.cv.height!==nV){
    const c=document.createElement("canvas"); c.width=nH; c.height=nV;
    o=off[p.key]={cv:c,ctx:c.getContext("2d"),img:c.getContext("2d").createImageData(nH,nV)};
  }
  const px=o.img.data, lut=activeLUT();
  const sh=S.strides[p.h], sv=S.strides[p.v], base=S.idx[p.fix]*S.strides[p.fix];
  const k=255/((S.vmax-S.vmin)||1);
  for (let j=0;j<nV;j++){
    const rb=base+j*sv;
    let q=(nV-1-j)*nH*4;
    for (let i=0;i<nH;i++,q+=4){
      const val=S.values[rb+i*sh];
      if (val!==val){ px[q]=214;px[q+1]=219;px[q+2]=226;px[q+3]=255; continue; }
      let t=(val-S.vmin)*k; t=t<0?0:t>255?255:t;
      const li=(t|0)*3;
      px[q]=lut[li];px[q+1]=lut[li+1];px[q+2]=lut[li+2];px[q+3]=255;
    }
  }
  o.ctx.putImageData(o.img,0,0);
  return o;
}

/* ---- drawing helpers ---- */
function box(r){ ctx.strokeStyle="#16202e"; ctx.lineWidth=1; ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1); }
function ticksX(r,lo,hi,below,n){
  ctx.fillStyle="#5d6b7d"; ctx.strokeStyle="#8fa0b4"; ctx.lineWidth=1;
  ctx.font="10px "+MONO; ctx.textAlign="center"; ctx.textBaseline="top";
  for (const t of niceTicks(lo,hi,n||4)){
    const x=r.x+(t-lo)/(hi-lo)*r.w;
    if (x<r.x-1||x>r.x+r.w+1) continue;
    ctx.beginPath(); ctx.moveTo(x,r.y+r.h); ctx.lineTo(x,r.y+r.h+4); ctx.stroke();
    if (below) ctx.fillText(fmtT(t),x,r.y+r.h+6);
  }
}
function ticksY(r,lo,hi,left,n){
  ctx.fillStyle="#5d6b7d"; ctx.strokeStyle="#8fa0b4"; ctx.lineWidth=1;
  ctx.font="10px "+MONO; ctx.textAlign="right"; ctx.textBaseline="middle";
  for (const t of niceTicks(lo,hi,n||5)){
    const y=r.y+r.h-(t-lo)/(hi-lo)*r.h;
    if (y<r.y-1||y>r.y+r.h+1) continue;
    ctx.beginPath(); ctx.moveTo(r.x-4,y); ctx.lineTo(r.x,y); ctx.stroke();
    if (left) ctx.fillText(fmtT(t),r.x-6,y);
  }
}
const MONO = 'ui-monospace, Menlo, Consolas, monospace';
function labelX(r,txt){
  ctx.fillStyle="#16202e"; ctx.font="11px "+MONO;
  ctx.textAlign="center"; ctx.textBaseline="top";
  ctx.fillText(txt,r.x+r.w/2,r.y+r.h+17);
}
function labelY(r,txt){
  ctx.save(); ctx.fillStyle="#16202e"; ctx.font="11px "+MONO;
  ctx.translate(r.x-GEO.labL+13,r.y+r.h/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(txt,0,0); ctx.restore();
}
function dashed(x1,y1,x2,y2,hot){
  ctx.save();
  ctx.lineWidth=hot?2:1.3; ctx.setLineDash([6,4]);
  ctx.strokeStyle="rgba(255,255,255,.92)";
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.lineDashOffset=5;
  ctx.strokeStyle=hot?"#a82d27":"rgba(0,0,0,.62)";
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}

/* ---- panels ---- */
function drawPanel(p){
  const r=L[p.key], nH=S.dims[p.h], nV=S.dims[p.v];
  if (nH<2||nV<2){ ctx.fillStyle="#f2f5f8"; ctx.fillRect(r.x,r.y,r.w,r.h); box(r); return; }
  if (p._built!==S.idx[p.fix]||p._epoch!==S.epoch){
    p._o=buildSlice(p); p._built=S.idx[p.fix]; p._epoch=S.epoch;
  }
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(p._o.cv,0,0,nH,nV,r.x,r.y,r.w,r.h);
  box(r);
  const [xl,xh]=axExtent(p.h), [yl,yh]=axExtent(p.v);
  ticksX(r,xl,xh,true); ticksY(r,yl,yh,true);
  labelX(r,axName(p.h)); labelY(r,axName(p.v));
  const cx=pxOf(r,nH,S.idx[p.h]), cy=pyOf(r,nV,S.idx[p.v]);
  dashed(r.x,cy,r.x+r.w,cy, HOT&&HOT.panel===p.key&&HOT.mode==="h");
  dashed(cx,r.y,cx,r.y+r.h, HOT&&HOT.panel===p.key&&HOT.mode==="v");
  ctx.fillStyle="#16202e"; ctx.font="10px "+MONO;
  ctx.textAlign="right"; ctx.textBaseline="bottom";
  ctx.fillText(axName(p.fix)+" = "+fmtT(axVal(p.fix,S.idx[p.fix])), r.x+r.w-5, r.y-3);
}

/* ---- 1-D strips ---- */
function cutData(a){
  const n=S.dims[a], o=[0,1,2].filter(d=>d!==a);
  const base=S.idx[o[0]]*S.strides[o[0]]+S.idx[o[1]]*S.strides[o[1]];
  const sa=S.strides[a], y=new Float64Array(n);
  let lo=Infinity,hi=-Infinity;
  for (let i=0;i<n;i++){ const v=S.values[base+i*sa]; y[i]=v; if(v===v){if(v<lo)lo=v;if(v>hi)hi=v;} }
  if (!isFinite(lo)){lo=0;hi=1;}
  if (lo===hi){lo-=1;hi+=1;}
  const pad=(hi-lo)*0.08;
  return {y,lo:lo-pad,hi:hi+pad,n};
}
function drawStrip(s){
  const r=L[s.key], pr=L[s.ref], n=S.dims[s.ax];
  ctx.fillStyle="#fbfcfd"; ctx.fillRect(r.x,r.y,r.w,r.h);
  box(r);
  if (n<2||!S.values) return;
  const {y,lo,hi}=cutData(s.ax);
  ctx.save(); ctx.beginPath(); ctx.rect(r.x,r.y,r.w,r.h); ctx.clip();
  ctx.strokeStyle="#1f3f77"; ctx.lineWidth=1.3; ctx.beginPath();
  let pen=false;
  if (s.dir==="h"){
    for (let i=0;i<n;i++){
      const v=y[i]; if (v!==v){pen=false;continue;}
      const X=pxOf(pr,n,i), Y=r.y+r.h-(v-lo)/(hi-lo)*r.h;
      pen?ctx.lineTo(X,Y):(ctx.moveTo(X,Y),pen=true);
    }
  } else {
    for (let i=0;i<n;i++){
      const v=y[i]; if (v!==v){pen=false;continue;}
      const Y=pyOf(pr,n,i), X=r.x+r.w-(v-lo)/(hi-lo)*r.w;  // value grows leftward
      pen?ctx.lineTo(X,Y):(ctx.moveTo(X,Y),pen=true);
    }
  }
  ctx.stroke(); ctx.restore();

  const hot = HOT&&HOT.strip===s.key;
  if (s.dir==="h"){
    const X=pxOf(pr,n,S.idx[s.ax]);
    ctx.save(); ctx.setLineDash([5,4]); ctx.lineWidth=hot?2:1.1;
    ctx.strokeStyle=hot?"#a82d27":"#16202e";
    ctx.beginPath(); ctx.moveTo(X,r.y); ctx.lineTo(X,r.y+r.h); ctx.stroke(); ctx.restore();
    ticksY(r,lo,hi,true,2);
  } else {
    const Y=pyOf(pr,n,S.idx[s.ax]);
    ctx.save(); ctx.setLineDash([5,4]); ctx.lineWidth=hot?2:1.1;
    ctx.strokeStyle=hot?"#a82d27":"#16202e";
    ctx.beginPath(); ctx.moveTo(r.x,Y); ctx.lineTo(r.x+r.w,Y); ctx.stroke(); ctx.restore();
    ctx.fillStyle="#5d6b7d"; ctx.font="9.5px "+MONO;
    ctx.textAlign="left"; ctx.textBaseline="top";
    ctx.fillText(fmtT(hi),r.x+2,r.y+r.h+5);
    ctx.textAlign="right"; ctx.fillText(fmtT(lo),r.x+r.w,r.y+r.h+5);
  }
}

/* ---- colorbar ---- */
function drawColorbar(){
  const r=L.cbar, lut=activeLUT();
  const img=ctx.createImageData(1,256);
  for (let i=0;i<256;i++){
    const li=(255-i)*3, o=i*4;
    img.data[o]=lut[li];img.data[o+1]=lut[li+1];img.data[o+2]=lut[li+2];img.data[o+3]=255;
  }
  if (!drawColorbar._c){ drawColorbar._c=document.createElement("canvas"); drawColorbar._c.width=1; drawColorbar._c.height=256; }
  drawColorbar._c.getContext("2d").putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(drawColorbar._c,0,0,1,256,r.x,r.y,r.w,r.h);
  box(r);
  ctx.fillStyle="#16202e"; ctx.font="10px "+MONO; ctx.textAlign="left";
  ctx.textBaseline="top";    ctx.fillText(fmtT(S.vmax),r.x+r.w+6,r.y);
  ctx.textBaseline="bottom"; ctx.fillText(fmtT(S.vmin),r.x+r.w+6,r.y+r.h);
  ctx.save(); ctx.translate(r.x+r.w+50,r.y+r.h/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font="11px "+MONO;
  ctx.fillText(S.dataName.split("/").pop(),0,0); ctx.restore();
}

/* ---- readout quadrant ---- */
function drawInfo(){
  const r=L.info;
  ctx.fillStyle="#16202e"; ctx.fillRect(r.x,r.y,r.w,r.h);
  const v=S.values?S.values[S.idx[0]*S.strides[0]+S.idx[1]*S.strides[1]+S.idx[2]*S.strides[2]]:NaN;
  let y=r.y+26;
  ctx.textAlign="left"; ctx.textBaseline="middle";
  for (let d=0;d<3;d++){
    if (S.dims[d]<2) continue;
    ctx.fillStyle="#7f93ab"; ctx.font="10px "+MONO;
    ctx.fillText(axName(d).toUpperCase(),r.x+20,y-13);
    ctx.fillStyle="#ffffff"; ctx.font="17px "+MONO;
    ctx.fillText(fmt(axVal(d,S.idx[d])),r.x+20,y+4);
    ctx.fillStyle="#6f8399"; ctx.font="11px "+MONO;
    ctx.fillText("index "+(S.idx[d]+1)+" / "+S.dims[d],r.x+180,y+4);
    y+=40;
  }
  ctx.fillStyle="#7f93ab"; ctx.font="10px "+MONO;
  ctx.fillText(S.dataName.split("/").pop().toUpperCase(),r.x+20,y-13);
  ctx.fillStyle="#8fd3b6"; ctx.font="21px "+MONO;
  ctx.fillText(fmt(v),r.x+20,y+6);
  ctx.fillStyle="#61748a"; ctx.font="10.5px "+MONO;
  ctx.textBaseline="bottom";
  ctx.fillText("drag dashed lines to move slices",r.x+20,r.y+r.h-26);
  ctx.fillText("wheel over a panel steps its slice",r.x+20,r.y+r.h-11);
}

let raf=false;
function draw(){
  if (raf) return; raf=true;
  requestAnimationFrame(()=>{
    raf=false;
    if (!S.values||!L) return;
    ctx.clearRect(0,0,cv.width,cv.height);
    for (const s of STRIP) drawStrip(s);
    for (const p of PAN) drawPanel(p);
    drawColorbar(); drawInfo();
  });
}

/* ===========================================================
   Interaction — grab the dashed lines
   =========================================================== */
let HOT=null, DRAG=null;
const NEAR=7;

function hit(x,y){
  for (const p of PAN){
    const r=L[p.key], nH=S.dims[p.h], nV=S.dims[p.v];
    if (nH<2||nV<2) continue;
    if (x>=r.x-NEAR&&x<=r.x+r.w+NEAR&&y>=r.y-NEAR&&y<=r.y+r.h+NEAR){
      const cx=pxOf(r,nH,S.idx[p.h]), cy=pyOf(r,nV,S.idx[p.v]);
      const dv=Math.abs(x-cx), dh=Math.abs(y-cy);
      if (dv<NEAR&&dv<=dh) return {panel:p.key,mode:"v"};
      if (dh<NEAR)         return {panel:p.key,mode:"h"};
      if (x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return {panel:p.key,mode:"both"};
    }
  }
  for (const s of STRIP){
    const r=L[s.key], pr=L[s.ref], n=S.dims[s.ax];
    if (n<2) continue;
    if (x<r.x-NEAR||x>r.x+r.w+NEAR||y<r.y-NEAR||y>r.y+r.h+NEAR) continue;
    if (s.dir==="h"){ if (Math.abs(x-pxOf(pr,n,S.idx[s.ax]))<NEAR) return {strip:s.key,mode:"v"}; }
    else            { if (Math.abs(y-pyOf(pr,n,S.idx[s.ax]))<NEAR) return {strip:s.key,mode:"h"}; }
  }
  const c=L.cbar;
  if (x>=c.x-4&&x<=c.x+c.w+4&&y>=c.y&&y<=c.y+c.h) return {cbar:true};
  return null;
}

function applyDrag(t,x,y){
  if (t.panel){
    const p=PAN.find(q=>q.key===t.panel), r=L[p.key];
    if (t.mode==="v"||t.mode==="both") S.idx[p.h]=ixOf(r,S.dims[p.h],x);
    if (t.mode==="h"||t.mode==="both") S.idx[p.v]=iyOf(r,S.dims[p.v],y);
  } else if (t.strip){
    const s=STRIP.find(q=>q.key===t.strip), pr=L[s.ref], n=S.dims[s.ax];
    S.idx[s.ax] = s.dir==="h" ? ixOf(pr,n,x) : iyOf(pr,n,y);
  }
  draw();
}

function pos(ev){
  const b=cv.getBoundingClientRect();
  return [ev.clientX-b.left, ev.clientY-b.top];
}
cv.addEventListener("pointermove",ev=>{
  if (!S.values||!L) return;
  const [x,y]=pos(ev);
  if (DRAG){
    if (DRAG.cbar){
      const dy=y-DRAG.y0, f=(S.vmax-S.vmin)/L.cbar.h;
      const sh=dy*f;                                  // drag down → window moves up in value
      setRange(DRAG.v0+sh,DRAG.v1+sh,true);
    } else applyDrag(DRAG,x,y);
    return;
  }
  const h=hit(x,y);
  const changed = JSON.stringify(h)!==JSON.stringify(HOT);
  HOT=h;
  cv.style.cursor = !h ? "default"
    : h.cbar ? "ns-resize"
    : h.mode==="v" ? "ew-resize"
    : h.mode==="h" ? "ns-resize" : "crosshair";
  if (changed) draw();
});
cv.addEventListener("pointerdown",ev=>{
  if (!S.values||!L) return;
  const [x,y]=pos(ev); const h=hit(x,y);
  if (!h) return;
  cv.setPointerCapture(ev.pointerId);
  if (h.cbar) DRAG={cbar:true,y0:y,v0:S.vmin,v1:S.vmax};
  else { DRAG=h; applyDrag(h,x,y); }
});
const endDrag=ev=>{ DRAG=null; try{cv.releasePointerCapture(ev.pointerId);}catch(e){} };
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("pointerleave",()=>{ if(!DRAG&&HOT){HOT=null;draw();} });

cv.addEventListener("wheel",ev=>{
  if (!S.values||!L) return;
  const [x,y]=pos(ev); const h=hit(x,y);
  if (!h) return;
  ev.preventDefault();
  if (h.cbar){                                        // wheel over the bar scales the window
    const mid=(S.vmin+S.vmax)/2, half=(S.vmax-S.vmin)/2*(ev.deltaY>0?1.12:0.893);
    setRange(mid-half,mid+half,true);
    return;
  }
  if (h.panel){
    const p=PAN.find(q=>q.key===h.panel), d=p.fix;
    S.idx[d]=Math.max(0,Math.min(S.dims[d]-1,S.idx[d]+(ev.deltaY>0?1:-1)));
    draw();
  }
},{passive:false});

window.addEventListener("keydown",e=>{
  if (!S.values) return;
  if (["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  const map={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowDown:[1,-1],ArrowUp:[1,1],PageDown:[2,-1],PageUp:[2,1]};
  const m=map[e.key]; if (!m) return;
  e.preventDefault();
  S.idx[m[0]]=Math.max(0,Math.min(S.dims[m[0]]-1,S.idx[m[0]]+m[1]));
  draw();
});

let rto;
window.addEventListener("resize",()=>{ clearTimeout(rto); rto=setTimeout(()=>{resize();draw();},80); });

/* ---------------- display controls ---------------- */
function setRange(lo,hi,quiet){
  if (!(hi>lo)) return;
  S.vmin=lo; S.vmax=hi; S.epoch++;
  $("inVmin").value=+lo.toPrecision(6); $("inVmax").value=+hi.toPrecision(6);
  draw();
}
$("selData").addEventListener("change",e=>selectData(e.target.value));
["selX","selY","selZ"].forEach((id,d)=>$(id).addEventListener("change",()=>{applyAxis(d);draw();}));
$("selCmap").addEventListener("change",e=>{S.cmap=e.target.value;S._inv=null;S.epoch++;draw();});
$("cbInv").addEventListener("change",e=>{S.invert=e.target.checked;S._inv=null;S.epoch++;draw();});
$("inVmin").addEventListener("input",e=>{const v=parseFloat(e.target.value);if(isFinite(v)&&v<S.vmax){S.vmin=v;S.epoch++;draw();}});
$("inVmax").addEventListener("input",e=>{const v=parseFloat(e.target.value);if(isFinite(v)&&v>S.vmin){S.vmax=v;S.epoch++;draw();}});
$("bAutoAll").addEventListener("click",()=>setRange(S.fullMin,S.fullMax));
$("bAutoSlice").addEventListener("click",()=>{
  const p=PAN[0], nH=S.dims[p.h], nV=S.dims[p.v], base=S.idx[p.fix]*S.strides[p.fix];
  let lo=Infinity,hi=-Infinity;
  for (let j=0;j<nV;j++){ const rb=base+j*S.strides[p.v];
    for (let i=0;i<nH;i++){ const v=S.values[rb+i*S.strides[p.h]]; if(v===v){if(v<lo)lo=v;if(v>hi)hi=v;} } }
  setRange(lo,hi);
});
$("bAutoPct").addEventListener("click",()=>{
  const N=S.values.length, st=Math.max(1,Math.floor(N/200000)), s=[];
  for (let i=0;i<N;i+=st){const v=S.values[i]; if(v===v) s.push(v);}
  if (s.length<4) return;
  s.sort((a,b)=>a-b);
  setRange(s[Math.floor(s.length*0.01)],s[Math.floor(s.length*0.99)]);
});

/* ---------------- local files ---------------- */
$("bLocal").addEventListener("click",()=>$("fileInput").click());
$("fileInput").addEventListener("change",async e=>{const f=e.target.files[0];if(f)openBuffer(await f.arrayBuffer(),f.name);});
["dragenter","dragover"].forEach(t=>window.addEventListener(t,e=>{e.preventDefault();document.body.classList.add("drag");}));
["dragleave","drop"].forEach(t=>window.addEventListener(t,e=>{e.preventDefault();if(t==="dragleave"&&e.relatedTarget)return;document.body.classList.remove("drag");}));
window.addEventListener("drop",async e=>{const f=e.dataTransfer.files[0];if(f)openBuffer(await f.arrayBuffer(),f.name);});

/* ---------------- Drive ---------------- */
let tokenClient=null;
function connect(then){
  if (S.token){ then&&then(); return; }
  if (!window.google||!google.accounts){ status("Google sign-in library did not load","err"); return; }
  tokenClient=tokenClient||google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:SCOPE,
    callback:resp=>{
      if (resp.error){ status("sign-in failed: "+resp.error,"err"); return; }
      S.token=resp.access_token;
      setTimeout(()=>{S.token=null;},(resp.expires_in?resp.expires_in-60:3500)*1000);
      $("bFolder").disabled=false; $("bFiles").disabled=false;
      $("bConnect").textContent="Signed in"; status("Signed in","ok");
      if (S.folderId) listFolder(S.folderId);
      then&&then();
    },
    error_callback:err=>status("sign-in cancelled"+(err&&err.type?" ("+err.type+")":""),"err")
  });
  tokenClient.requestAccessToken();
}
$("bConnect").addEventListener("click",()=>connect());
function api(path){
  return fetch("https://www.googleapis.com"+path,{headers:{Authorization:"Bearer "+S.token}})
    .then(async res=>{ const t=await res.text(); let j=null; try{j=JSON.parse(t);}catch(e){}
      if (!res.ok) throw new Error((j&&j.error&&j.error.message)||res.status+" "+res.statusText);
      return j; });
}
function openPicker(foldersOnly){
  if (!S.pickerReady){ status("Picker is still loading","err"); return; }
  const view=label=>new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setIncludeFolders(true).setSelectFolderEnabled(foldersOnly)
    .setMode(google.picker.DocsViewMode.LIST).setLabel(label);
  const b=new google.picker.PickerBuilder()
    .setOAuthToken(S.token).setDeveloperKey(API_KEY).setAppId(APP_ID)
    .addView(view("My Drive").setOwnedByMe(true))
    .addView(view("Shared with me").setOwnedByMe(false))
    .addView(view("Shared drives").setEnableDrives(true))
    .enableFeature(google.picker.Feature.SUPPORT_DRIVES)
    .setCallback(data=>{
      if (data.action!==google.picker.Action.PICKED) return;
      const doc=data.docs[0];
      if (doc.mimeType===FOLDER_MIME){ S.folderId=doc.id; saveHash(); listFolder(doc.id); }
      else showFiles(data.docs.map(d=>({id:d.id,name:d.name,size:d.sizeBytes})));
    });
  if (!foldersOnly) b.enableFeature(google.picker.Feature.MULTISELECT_ENABLED);
  if (location.origin) b.setOrigin(location.origin);
  b.build().setVisible(true);
}
$("bFolder").addEventListener("click",()=>connect(()=>openPicker(true)));
$("bFiles").addEventListener("click",()=>connect(()=>openPicker(false)));
function listFolder(id){
  status("Listing folder…");
  const q=encodeURIComponent("'"+id+"' in parents and trashed=false");
  api("/drive/v3/files?q="+q+"&pageSize=200&orderBy=name&fields=files(id,name,mimeType,size)"+
      "&supportsAllDrives=true&includeItemsFromAllDrives=true")
    .then(r=>{
      const fs=(r.files||[]).filter(f=>f.mimeType!==FOLDER_MIME&&DATA_EXT.test(f.name));
      if (!fs.length){ status("no .mat files in that folder","err"); showFiles([]); return; }
      showFiles(fs.map(f=>({id:f.id,name:f.name,size:f.size})));
      status(fs.length+" file"+(fs.length===1?"":"s")+" available","ok");
      $("bShare").classList.remove("hidden");
    })
    .catch(e=>status("cannot list folder: "+e.message,"err"));
}
function showFiles(list){
  const box=$("files"); box.innerHTML="";
  $("filesBar").classList.toggle("hidden",!list.length);
  for (const f of list){
    const b=document.createElement("button");
    b.className="chip";
    b.innerHTML=f.name+(f.size?'<span class="sz">'+fmtBytes(+f.size)+"</span>":"");
    b.addEventListener("click",()=>{ [...box.children].forEach(c=>c.classList.remove("on")); b.classList.add("on"); loadDriveFile(f); });
    box.appendChild(b);
  }
}
async function loadDriveFile(f){
  if (!S.token){ connect(()=>loadDriveFile(f)); return; }
  try{
    status("Downloading "+f.name+" …");
    const res=await fetch("https://www.googleapis.com/drive/v3/files/"+f.id+"?alt=media&supportsAllDrives=true",
      {headers:{Authorization:"Bearer "+S.token}});
    if (!res.ok) throw new Error(res.status+" "+res.statusText);
    const total=+(f.size||res.headers.get("content-length")||0);
    const rd=res.body&&res.body.getReader?res.body.getReader():null;
    let buf;
    if (rd){
      const cs=[]; let got=0;
      for(;;){ const {done,value}=await rd.read(); if (done) break;
        cs.push(value); got+=value.length;
        status("Downloading "+f.name+" — "+fmtBytes(got)+(total?" of "+fmtBytes(total):"")); }
      const u=new Uint8Array(got); let o=0;
      for (const c of cs){ u.set(c,o); o+=c.length; }
      buf=u.buffer;
    } else buf=await res.arrayBuffer();
    await openBuffer(buf,f.name);
  }catch(e){ status("download failed: "+e.message,"err"); }
}
function saveHash(){ if (S.folderId) history.replaceState(null,"","#folder="+S.folderId); }
$("bShare").addEventListener("click",()=>{
  const url=location.origin+location.pathname+"#folder="+S.folderId;
  navigator.clipboard.writeText(url).then(
    ()=>status("Link copied — send it to a collaborator you have shared the folder with","ok"),
    ()=>status(url,""));
});

/* ---------------- boot ---------------- */
(function(){ const p=new URLSearchParams(location.hash.slice(1)); if (p.get("folder")) S.folderId=p.get("folder"); })();
(function waitPicker(){ if (window.gapi) gapi.load("picker",()=>{S.pickerReady=true;}); else setTimeout(waitPicker,250); })();
try{
  const eng=await loadH5();
  S.h5=eng.h; S.fs=eng.fs;
  status(S.folderId?"Ready — sign in to open the shared folder":"Ready");
}catch(e){
  status("could not load the HDF5 engine — check the network and reload","err");
}
</script>
</body>
